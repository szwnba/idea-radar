name: Radar Sweep

on:
  schedule:
    # 每 2 小时巡扫一次（分钟偏移 7 避开整点拥堵）
    - cron: "7 */2 * * *"
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

concurrency:
  group: radar-sweep
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sweep channels
        run: pnpm collect

      - name: Commit & push new data
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new signals this sweep."
          else
            git commit -m "data: sweep $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
